<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="/demo/assets/shiba_glb.txt" as="fetch" crossorigin>
<style>
/* FIGUNI site. Resin-and-primer studio: unpainted resin white, primer grey niches, navy ink.
   Coral is reserved for the one action (enter the demo); the four paints are content, never decoration. */
:root{
  --resin:#F1F2EE; --paper:#FFFFFF; --primer:#DDE1E3; --primer-2:#E7EAEB; --line:#CDD3D8;
  --ink:#1F2A44; --muted:#5A6477; --coral:#F2643F; --coral-dark:#DC5230;
  --caramel:#C9823F; --cream:#F2E4CC; --sakura:#E8969A; --cocoa:#3A2A24;
  --f-brand:'Fredoka',ui-rounded,system-ui,sans-serif;
  --f-text:'Noto Sans SC','Noto Sans KR',system-ui,-apple-system,'PingFang SC','Malgun Gothic',sans-serif;
  --wrap:1200px; --gut:clamp(16px,4vw,40px);
  color-scheme:light;
}
html[lang="ko"]{--f-text:'Noto Sans KR','Noto Sans SC',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--resin);color:var(--ink);font:400 17px/1.75 var(--f-text);text-rendering:optimizeLegibility}
html[lang="ko"] body{word-break:keep-all}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:clamp(28px,3.6vw,44px);line-height:1.22}
h3{font-size:21px;line-height:1.4;font-weight:700;letter-spacing:0}
p{margin:0}
.lead{font-size:clamp(17px,1.5vw,19px);color:var(--muted);max-width:36em}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.wordmark{font-family:var(--f-brand);font-weight:600;letter-spacing:.01em}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;text-decoration:none;
  background:var(--coral);color:#fff;font-weight:700;font-size:17px;line-height:1;padding:17px 28px;border-radius:999px;
  transition:background-color .15s ease}
.btn:hover{background:var(--coral-dark)}
.btn svg{width:18px;height:18px;flex:none}
.btn-sm{font-size:15px;padding:11px 18px}
.link{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--line)}
.link:hover{text-decoration-color:var(--ink)}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(241,242,238,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:68px}
.nav .wordmark{font-size:26px;text-decoration:none;display:flex;align-items:baseline;gap:8px}
.nav .wordmark small{font-family:var(--f-text);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
.nav ul{display:flex;gap:26px;list-style:none;margin:0 0 0 auto;padding:0}
.nav ul a{text-decoration:none;font-size:15px;font-weight:500;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}
.lang{display:inline-flex;background:var(--primer-2);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(31,42,68,.12)}

/* hero */
.hero{padding:clamp(24px,4vw,48px) 0 clamp(48px,6vw,80px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.hero h1{font-size:clamp(40px,5.6vw,76px);line-height:1.12;white-space:pre-line}
html[lang="ko"] .hero h1{font-size:clamp(34px,4.5vw,60px);line-height:1.2}
.hero .lead{margin-top:24px}
.hero .actions{display:flex;flex-wrap:wrap;align-items:center;gap:22px 28px;margin-top:36px}
.tagline{margin-top:40px;font-family:var(--f-brand);font-weight:500;font-size:15px;color:var(--muted)}
.tagline b{font-weight:600;color:var(--ink)}

.studio{display:flex;flex-direction:column;gap:22px}
.niche{position:relative;aspect-ratio:4/4.3;max-height:min(56vh,580px);border-radius:999px 999px 32px 32px;overflow:hidden;
  background:linear-gradient(180deg,#E9ECED 0%,#DADFE2 62%,#CFD5D9 100%)}
.niche::after{content:"";position:absolute;left:16%;right:16%;bottom:11%;height:7%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(31,42,68,.22),rgba(31,42,68,0));pointer-events:none}
.niche .poster,.niche canvas{position:absolute;inset:0;width:100%;height:100%}
.niche .poster{object-fit:contain;transition:opacity .4s ease}
.niche canvas{opacity:0;transition:opacity .4s ease;z-index:1}
.niche.ready canvas{opacity:1}
.niche.ready .poster{opacity:0}
.niche .status{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:13px;color:var(--muted);z-index:2}
.niche.ready .status{display:none}
.niche .done{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:2;width:max-content;max-width:calc(100% - 48px);text-align:center;
  background:var(--paper);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;box-shadow:0 6px 18px rgba(31,42,68,.12)}
.niche .done[hidden]{display:none}

.paints-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.paints-head b{font-size:16px}
.reset{border:0;background:none;cursor:pointer;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;padding:4px 0}
.reset:hover{color:var(--ink)}
.paints{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.paints li{display:flex}
.paint{width:100%;height:100%;border:0;background:var(--paper);border-radius:18px;padding:14px 10px 12px;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:box-shadow .15s ease}
.paint .pot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-brand);font-weight:600;font-size:19px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);margin-bottom:6px;transition:transform .2s ease}
.paint .nm{font-weight:700;font-size:15px;line-height:1.3}
.paint .ar{font-size:12px;color:var(--muted);line-height:1.45}
.paint:hover{box-shadow:0 0 0 1px var(--line)}
.paint[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.paint[aria-pressed="true"] .pot{transform:scale(1.08)}
.caption{font-size:13px;color:var(--muted);line-height:1.6}

/* sections */
section.block{padding:clamp(72px,9vw,128px) 0}
.head{display:grid;gap:18px;margin-bottom:clamp(36px,5vw,56px)}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,2.4vw,28px);list-style:none;margin:0;padding:0;counter-reset:s}
.step figure{margin:0 0 20px;border-radius:22px;overflow:hidden;background:var(--primer-2);aspect-ratio:4/3.4}
.step figure img{width:100%;height:100%;object-fit:cover}
.step .num{font-family:var(--f-brand);font-weight:600;font-size:15px;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ink);color:var(--resin);margin-bottom:12px}
.step p{color:var(--muted);font-size:16px;margin-top:6px}
.step .time{display:inline-block;margin-top:14px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--paper)}
.steps-note{margin-top:28px}

/* compare */
.compare-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--gut) * -1);padding:0 var(--gut)}
table.compare{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;font-size:16px}
.compare th,.compare td{padding:16px 18px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.compare thead th{border-bottom:2px solid var(--ink);font-size:16px;vertical-align:bottom}
.compare thead th span{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.compare tbody th{font-weight:500;color:var(--muted);width:17%;white-space:nowrap}
.compare .us{background:var(--paper)}
.compare thead .us{border-radius:20px 20px 0 0}
.compare tbody tr:last-child .us{border-radius:0 0 20px 20px}
.compare tbody tr:last-child td,.compare tbody tr:last-child th{border-bottom:0}
.compare thead .us .wordmark{font-size:20px}
.yes,.no{display:inline-flex;align-items:center;gap:8px}
.yes::before,.no::before{content:"";width:11px;height:11px;border-radius:50%;flex:none}
.yes::before{background:var(--ink)}
.no::before{box-shadow:inset 0 0 0 1.5px var(--muted)}
.no{color:var(--muted)}
.compare .us strong{font-weight:700}
.compare-note{margin-top:20px}

/* demand */
.demand .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,88px);align-items:end}
.bar{display:flex;height:64px;border-radius:16px;overflow:hidden;gap:3px}
.bar span{display:block;height:100%}
.legend{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:12px}
.legend li{display:grid;grid-template-columns:14px 44px 1fr;align-items:baseline;gap:12px;font-size:16px}
.legend i{width:14px;height:14px;border-radius:4px;align-self:center}
.legend b{font-family:var(--f-brand);font-weight:600;font-size:22px;line-height:1}

/* partners */
.partners{background:var(--ink);color:var(--resin)}
.partners .lead{color:#B9C1CE}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,5vw,72px)}
.col h3{display:flex;align-items:baseline;gap:12px;padding-bottom:16px;border-bottom:1px solid rgba(241,242,238,.22)}
.col h3 span{font-size:14px;font-weight:400;color:#B9C1CE}
.col ul{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:14px}
.col li{display:grid;grid-template-columns:12px 1fr;gap:14px;color:#E3E7EC}
.col li::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:.62em;background:var(--dot)}

/* team */
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,32px)}
.person{background:var(--paper);border-radius:28px;padding:clamp(24px,3vw,36px);display:grid;grid-template-columns:72px 1fr;gap:22px;align-items:start}
.mono{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--cocoa)}
.person .who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.person .who h3{font-size:22px}
.person .who span{font-family:var(--f-brand);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:.04em}
.person .role{font-weight:700;margin-top:4px}
.person ul{margin:12px 0 0;padding-left:1.1em;color:var(--muted);font-size:15px;display:grid;gap:4px}
.school{margin-top:24px}

/* final */
.final{padding-bottom:clamp(64px,8vw,112px)}
.final .panel{background:var(--primer-2);border-radius:40px;padding:clamp(32px,5vw,72px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,5vw,64px);align-items:center;overflow:hidden}
.final .panel .lead{margin-top:18px}
.final .panel .btn{margin-top:32px}
.phone{justify-self:center;width:min(300px,100%);border:10px solid var(--ink);border-radius:46px;overflow:hidden;background:var(--ink);box-shadow:0 30px 60px rgba(31,42,68,.18)}
.phone img{width:100%;border-radius:36px}

footer{padding:36px 0 48px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px}
footer .wordmark{color:var(--ink);font-size:18px}

@media (max-width:960px){
  .nav ul{display:none}
  .nav .wrap{gap:14px}
  .nav .lang{margin-left:auto}
  .hero .wrap{grid-template-columns:1fr}
  .studio{max-width:560px;width:100%;margin:0 auto}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:44px}
  .demand .wrap,.cols,.people,.final .panel{grid-template-columns:1fr}
  .final .panel{text-align:left}
}
@media (max-width:560px){
  body{font-size:16px}
  .nav .wordmark small{display:none}
  .nav .btn-sm{padding:10px 14px;font-size:14px}
  .lang button{padding:6px 9px}
  .paints{grid-template-columns:repeat(2,minmax(0,1fr))}
  .paint{flex-direction:row;text-align:left;gap:12px;padding:12px}
  .paint .pot{margin:0;width:40px;height:40px;font-size:17px;flex:none}
  .paint .txt{min-width:0}
  .steps{grid-template-columns:1fr}
  .person{grid-template-columns:1fr}
  .final .panel{border-radius:28px}
}
@media (min-width:961px) and (max-height:820px){.hero{padding-top:12px}.niche{max-height:50vh}.paint{padding:10px 8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

  cn: {

  const key = new THREE.DirectionalLight(0xfff3e6, 2.1); key.position.set(-2.2, 3.2, 2.6); scene.add(key);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.enablePan = false; controls.enableZoom = false;
  controls.minPolarAngle = 0.95; controls.maxPolarAngle = 1.72;
  controls.autoRotate = !reduce; controls.autoRotateSpeed = 1.1;
  if (coarse) { controls.enableRotate = false; renderer.domElement.style.touchAction = 'pan-y'; }
  const target = new THREE.Vector3(0, 0.02, 0);
  const dir = new THREE.Vector3(-1.0, 0.42, 2.35).normalize();

  const white = new THREE.MeshStandardMaterial({ color: 0xE8E9E5, roughness: 0.6, metalness: 0 });
  let mesh = null, original = null, partOf = null;
  const layers = new Map();
  let tweens = [];

  function size() {
    const w = niche.clientWidth || 400, h = niche.clientHeight || 430;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    const half = THREE.MathUtils.degToRad(camera.fov / 2);
    const d = Math.max(2.55, 0.78 / (Math.tan(half) * camera.aspect));
    camera.position.copy(target).addScaledVector(dir, d); camera.updateProjectionMatrix(); controls.target.copy(target); controls.update();
  }
  new ResizeObserver(size).observe(niche); size();

  function layer(i) {
    if (layers.has(i)) return layers.get(i);
    const g = mesh.geometry, idx = g.index, pos = g.attributes.position, out = [];
    const nf = idx ? idx.count / 3 : pos.count / 3;
    for (let f = 0; f < nf; f++) {
      if (CLS[partOf[f]] !== i) continue;
      for (let k = 0; k < 3; k++) { const v = idx ? idx.getX(f * 3 + k) : f * 3 + k; out.push(pos.getX(v), pos.getY(v), pos.getZ(v)); }
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(out, 3)); geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color: PAINT[i], roughness: i === 3 ? 0.35 : 0.55, transparent: true, opacity: 0, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    const m = new THREE.Mesh(geo, mat); m.visible = false; mesh.add(m);
    const L = { m, mat }; layers.set(i, L); return L;
  }
  function fade(L, to) {
    if (to > 0) L.m.visible = true;
    if (reduce) { L.mat.opacity = to; L.m.visible = to > 0; settle(); return; }
    tweens = tweens.filter((tw) => tw.L !== L);
    tweens.push({ L, from: L.mat.opacity, to, t0: performance.now() });
  }
  function settle() {
    const all = [0, 1, 2, 3].every((i) => layers.get(i)?.mat.opacity > 0.99 && layers.get(i).m.visible);
    if (!original) return;
    mesh.material = all ? original : white;
    layers.forEach((L) => { L.m.visible = all ? false : L.mat.opacity > 0.001; });
  }
  const on = new Set();
  window.HERO3D = {
    paint(i, v) {
      if (!mesh || !partOf) return;
      v ? on.add(i) : on.delete(i);
      if (mesh.material === original && on.size < 4) { mesh.material = white; layers.forEach((L, k) => { L.m.visible = on.has(k) || k === i; }); }
      fade(layer(i), v ? 1 : 0);
      controls.autoRotate = !reduce;
    },
    reset() { on.clear(); if (!mesh) return; mesh.material = white; layers.forEach((L) => fade(L, 0)); },
  };
  window.__poster = () => { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); };

  const txt = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u); return r.text(); });
  Promise.all([txt('/demo/assets/shiba_glb.txt'), txt('/demo/assets/parts_b64.txt')]).then(([g64, p64]) => {
    const pb = atob(p64.trim()); partOf = new Uint8Array(pb.length); for (let i = 0; i < pb.length; i++) partOf[i] = pb.charCodeAt(i);
    const gb = atob(g64.trim()); const buf = new Uint8Array(gb.length); for (let i = 0; i < gb.length; i++) buf[i] = gb.charCodeAt(i);
    new GLTFLoader().parse(buf.buffer, '', (gltf) => {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
      const k = 1.25 / Math.max(s.x, s.y, s.z);
      model.scale.setScalar(k); model.position.set(-c.x * k, -box.min.y * k - 0.36, -c.z * k);
      model.traverse((o) => { if (o.isMesh && !mesh) mesh = o; });
      original = mesh.material; mesh.material = white;
      scene.add(model);
      niche.classList.add('ready');
      window.dispatchEvent(new Event('hero3d-ready'));
    }, () => {});
  }).catch(() => {});

  let visible = true;
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(niche);
  renderer.setAnimationLoop((now) => {
    if (!visible) return;
    if (tweens.length) {
      tweens = tweens.filter((tw) => {
        const p = Math.min(1, (now - tw.t0) / 480), e = 1 - Math.pow(1 - p, 3);
        tw.L.mat.opacity = tw.from + (tw.to - tw.from) * e;
        if (p >= 1) { if (tw.to === 0) tw.L.m.visible = false; return false; }
        return true;
      });
      if (!tweens.length) settle();
    }
    controls.update(); renderer.render(scene, camera);
  });
}
</script>
</body>
</html>
