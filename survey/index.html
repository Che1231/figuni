<style>
/* Same resin-and-ink look as the landing page. Coral stays reserved for the one action: submitting. */
:root{
  --resin:#F1F2EE; --paper:#FFFFFF; --primer:#DDE1E3; --primer-2:#E7EAEB; --line:#CDD3D8; --wash:#F6F7F4;
  --ink:#1F2A44; --muted:#5A6477; --coral:#F2643F; --coral-dark:#DC5230; --ok:#2E7D5B;
  --f-brand:'Fredoka',ui-rounded,system-ui,sans-serif;
  --f-text:'Noto Sans SC','Noto Sans KR',system-ui,-apple-system,'PingFang SC','Malgun Gothic',sans-serif;
  --gut:clamp(16px,4vw,32px);
  color-scheme:light;
}
html[lang="ko"]{--f-text:'Noto Sans KR','Noto Sans SC',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:96px}
body{margin:0;background:var(--resin);color:var(--ink);font:400 16px/1.7 var(--f-text);text-rendering:optimizeLegibility}
html[lang="ko"] body{word-break:keep-all}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
h1,h2,h3{margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
.wrap{max-width:780px;margin:0 auto;padding:0 var(--gut)}

/* header + progress */
.top{position:sticky;top:0;z-index:10;background:rgba(241,242,238,.9);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px;max-width:1100px}
.wordmark{font-family:var(--f-brand);font-weight:600;font-size:24px;letter-spacing:.01em;text-decoration:none;display:flex;align-items:baseline;gap:8px}
.wordmark small{font-family:var(--f-text);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
.lang{display:inline-flex;background:var(--primer-2);border-radius:999px;padding:3px;margin-left:auto}
.lang button{border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(31,42,68,.12)}
.home{font-size:14px;font-weight:700;text-decoration:none;color:var(--muted);white-space:nowrap}
.home:hover{color:var(--ink)}
.bar{height:4px;background:var(--primer-2)}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s ease}
.count{position:absolute;right:max(var(--gut),calc((100% - 1100px)/2 + var(--gut)));top:72px;font-family:var(--f-brand);font-weight:600;font-size:13px;color:var(--muted);
  background:var(--paper);border-radius:999px;padding:3px 12px;box-shadow:0 2px 8px rgba(31,42,68,.08);transition:opacity .2s}

main{padding:28px 0 96px}
/* intro */
.intro{background:var(--paper);border-radius:28px;padding:clamp(24px,4vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.kicker{font-size:14px;font-weight:700;color:var(--muted)}
.intro h1{font-size:clamp(26px,4.2vw,38px);line-height:1.25;font-weight:800;margin-top:8px}
.intro .desc{margin-top:16px;color:var(--muted);font-size:15.5px}
.intro img{width:clamp(96px,16vw,150px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;list-style:none;padding:0}
.chips li{background:var(--wash);border:1px solid var(--primer);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.howto{margin:18px 4px 0;font-size:14px;color:var(--muted)}

/* questions */
form{display:grid;gap:14px;margin-top:22px}
fieldset{margin:0;min-width:0;border:0;background:var(--paper);border-radius:22px;padding:clamp(20px,3.4vw,30px)}
legend{float:left;width:100%;padding:0;display:flex;gap:14px;align-items:flex-start}
legend + *{clear:both}
.qn{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-brand);font-weight:600;font-size:15px;
  background:var(--primer-2);color:var(--muted);transition:background-color .2s,color .2s;margin-top:1px}
fieldset.done .qn{background:var(--ink);color:#fff}
.qt{font-size:17.5px;font-weight:700;line-height:1.5}
.tag{display:inline-block;margin-left:8px;vertical-align:2px;font-size:12px;font-weight:700;color:var(--muted);background:var(--wash);border:1px solid var(--primer);border-radius:999px;padding:1px 9px;white-space:nowrap}
.opts{display:grid;gap:8px;margin-top:16px;padding-left:48px}
.opts.cols{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.opt{position:relative;display:flex;align-items:flex-start;gap:12px;border-radius:14px;padding:12px 14px;background:var(--wash);cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--primer);transition:box-shadow .15s,background-color .15s;line-height:1.5}
.opt:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mk{flex:none;width:20px;height:20px;margin-top:1.5px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;transition:border-color .15s,background-color .15s}
.opt input[type=radio] + .mk{border-radius:50%}
.opt input[type=checkbox] + .mk{border-radius:6px}
.opt .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .15s}
.opt input[type=checkbox] + .mk::after{width:10px;height:6px;border-radius:0;background:none;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) scale(0);margin-top:-2px}
.opt input:checked + .mk{border-color:var(--ink);background:var(--ink)}
.opt input:checked + .mk::after{transform:scale(1)}
.opt input[type=checkbox]:checked + .mk::after{transform:rotate(-45deg) scale(1)}
.opt:has(input:checked){background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink)}
.opt:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed}
.opt .lb{font-size:15px;font-weight:500}
.opt .lb b{display:block;font-weight:700}
.opt .lb small{display:block;font-size:13.5px;color:var(--muted);font-weight:400;margin-top:2px}
.limit{margin:10px 0 0 48px;font-size:13px;color:var(--muted)}
.limit.full{color:var(--ink);font-weight:700}
textarea{display:block;width:calc(100% - 48px);margin:16px 0 0 48px;min-height:120px;resize:vertical;border:0;border-radius:14px;padding:14px;background:var(--wash);
  box-shadow:inset 0 0 0 1px var(--primer);font-size:15px;line-height:1.6}
textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink);background:var(--paper)}

/* submit */
.send{background:var(--paper);border-radius:22px;padding:clamp(22px,3.4vw,30px);display:grid;gap:14px;justify-items:start}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;text-decoration:none;background:var(--coral);color:#fff;font-weight:700;font-size:17px;line-height:1;
  padding:17px 30px;border-radius:999px;transition:background-color .15s}
.btn:hover{background:var(--coral-dark)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn svg{width:18px;height:18px}
.ghost{display:inline-flex;align-items:center;font-weight:700;text-decoration:none;padding:15px 24px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--ink)}
.small{font-size:13px;color:var(--muted);line-height:1.6}
.msg{font-size:14px;font-weight:700;color:var(--coral-dark)}
.msg[hidden]{display:none}
.msg a{font-weight:700}

/* thanks */
.thanks{background:var(--paper);border-radius:28px;padding:clamp(28px,5vw,48px);text-align:center;display:grid;justify-items:center;gap:14px;margin-top:22px}
.thanks[hidden]{display:none}
.thanks img{width:150px}
.thanks h2{font-size:clamp(26px,4vw,34px);font-weight:800}
.thanks p{color:var(--muted);max-width:30em}
.thanks .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
footer{padding:26px 0 40px;font-size:13px;color:var(--muted);text-align:center}
footer .fw{font-family:var(--f-brand);font-weight:600;font-size:15px;color:var(--ink)}

@media (max-width:560px){
  .top .wrap{gap:10px}
  .wordmark small{display:none}
  .home{font-size:13px}
  .intro{grid-template-columns:1fr}
  .intro img{display:none}
  .opts,.limit{padding-left:0;margin-left:0}
  .opts{margin-top:14px}
  textarea{width:100%;margin-left:0}
  .count{top:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const split = (s) => { const i = s.indexOf(' / '); return i < 0 ? [s, s] : [s.slice(0, i), s.slice(i + 3)]; };
const clean = (t) => t.replace(/^\d+\.\s*/, '').replace(/\s*[（(](可多选|最多选3项|选填|복수 선택|최대 3개 선택|선택)[）)]\s*$/, '');
let lang = 'kr';
try { if (sessionStorage.getItem('figuni-lang') === 'cn') lang = 'cn'; } catch (e) {}
const DRAFT = 'figuni-survey-draft';

// build the form once; texts are filled by render()
const form = $('#form');
Q.forEach(([entry, type, title, opts], qi) => {
  const fs = document.createElement('fieldset'); fs.dataset.q = qi;
  const kind = type === 't' ? 'text' : type === 'r' ? 'radio' : 'checkbox';
  let html = `<legend><span class="qn" aria-hidden="true">${qi + 1}</span><span class="qt"></span></legend>`;
  if (kind === 'text') html += `<textarea name="entry.${entry}" rows="4" maxlength="2000"></textarea>`;
  else {
    html += `<div class="opts" data-n="${opts.length}">` + opts.map((v, oi) => `<label class="opt"><input type="${kind}" name="entry.${entry}" value="${esc(v)}"><span class="mk" aria-hidden="true"></span><span class="lb" data-o="${oi}"></span></label>`).join('') + '</div>';
    if (type === 'c3') html += '<p class="limit" aria-live="polite"></p>';

  fs.innerHTML = html; form.appendChild(fs);
});
form.insertAdjacentHTML('beforeend', `<div class="send"><button class="btn" type="submit" id="send"><span></span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h11m-4.5-5L15 10l-4.5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <p class="msg" id="msg" role="alert" hidden></p><p class="small" id="note"></p></div>`);

function render() {
  const t = T[lang], k = lang === 'cn' ? 0 : 1;
  document.documentElement.lang = lang === 'cn' ? 'zh-CN' : 'ko';
  document.title = t.title;
  document.querySelectorAll('[data-t]').forEach((el) => { const v = t[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  form.querySelectorAll('fieldset').forEach((fs) => {
    const [, type, title, opts] = Q[+fs.dataset.q];
    const tag = type === 'c' ? t.multi : type === 'c3' ? t.max3 : type === 't' ? t.opt : '';
    fs.querySelector('.qt').innerHTML = esc(clean(split(title)[k])) + (tag ? `<span class="tag">${esc(tag)}</span>` : '');
    let longest = 0;
    fs.querySelectorAll('.lb').forEach((lb) => {
      const txt = split(opts[+lb.dataset.o])[k]; longest = Math.max(longest, txt.length);
      const m = txt.match(/^(.+?)[：:]\s*(.+)$/);  // "head: detail" options (question 8)
      lb.innerHTML = m && txt.length > 12 ? `<b>${esc(m[1])}</b><small>${esc(m[2])}</small>` : esc(txt);
    });
    const box = fs.querySelector('.opts'); if (box) box.classList.toggle('cols', longest <= (k ? 10 : 8));
    const ta = fs.querySelector('textarea'); if (ta) ta.placeholder = t.ph;

}
function answered(fs) {
  const ta = fs.querySelector('textarea'); if (ta) return ta.value.trim() !== '';
  return !!fs.querySelector('input:checked');
}
function update() {
  const t = T[lang]; let n = 0;
  form.querySelectorAll('fieldset').forEach((fs) => {
    const a = answered(fs); fs.classList.toggle('done', a); if (a) n++;
    const lim = fs.querySelector('.limit');
    if (lim) {
      const c = fs.querySelectorAll('input:checked').length;
      fs.querySelectorAll('input').forEach((i) => { i.disabled = c >= 3 && !i.checked; });
      lim.textContent = c >= 3 ? t.full : t.limit(c); lim.classList.toggle('full', c >= 3);
    }
  });
  $('#bar').style.width = `${(n / Q.length) * 100}%`;
  $('#count').textContent = t.count(n);
  return n;
}
function saveDraft() {
  try {
    const d = {}; new FormData(form).forEach((v, key) => { (d[key] = d[key] || []).push(v); });
    localStorage.setItem(DRAFT, JSON.stringify(d));
  } catch (e) {}
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT) || 'null'); if (!d) return;
    form.querySelectorAll('input').forEach((i) => { if ((d[i.name] || []).includes(i.value)) i.checked = true; });
    form.querySelectorAll('textarea').forEach((ta) => { if (d[ta.name]) ta.value = d[ta.name][0]; });
  } catch (e) {}
}
form.addEventListener('change', (e) => {
  const fs = e.target.closest('fieldset'); const was = fs.classList.contains('done');

  if (e.target.type === 'radio' && !was) {
    const next = fs.nextElementSibling;
    if (next && next.getBoundingClientRect().top > window.innerHeight - 120 && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setTimeout(() => next.scrollIntoView({ behavior: 'smooth', block: 'start' }), 160);
    }
  }
});
form.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') { update(); saveDraft(); } });

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = T[lang], msg = $('#msg'), btn = $('#send');
  if (update() === 0) { msg.textContent = t.empty; msg.hidden = false; return; }
  const body = new URLSearchParams();
  new FormData(form).forEach((v, key) => { if (String(v).trim() !== '') body.append(key, String(v).trim()); });
  const fbzx = String(Math.floor(Math.random() * 9e17) + 1e17) + String(Math.floor(Math.random() * 10));
  body.append('fvv', '1'); body.append('pageHistory', '0'); body.append('fbzx', fbzx);
  body.append('partialResponse', JSON.stringify([null, null, fbzx])); body.append('submissionTimestamp', '-1');

    await fetch(`${FORM}/formResponse`, { method: 'POST', mode: 'no-cors', body });

    msg.innerHTML = `${esc(t.fail)}<a href="${FORM}/viewform" target="_blank" rel="noopener">${esc(t.failLink)}</a>`; msg.hidden = false;

});
