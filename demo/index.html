<body>
<style>
/* Layout: a phone-sized app on a quiet stage; on desktop a short guide column sits beside it.
   Palette: navy ink + coral action colour from the FIGUNI plan, cool paper neutrals, acrylic paint swatches as content. */
:root{
  --stage:#E9EDF2; --paper:#F5F7FA; --surface:#FFFFFF; --sunk:#EEF1F5;
  --ink:#1F2A44; --muted:#667086; --line:#DCE1E9;
  --accent:#F2643F; --accent-soft:#FDE9E2; --on-accent:#FFFFFF;
  --teal:#13879A; --teal-soft:#DDF1F4; --ok:#2B8F5F; --ok-soft:#E1F3EA;
  --shadow:0 18px 50px rgba(31,42,68,.16);
  --p-caramel:#C9823F; --p-cream:#F2E4CC; --p-pink:#E8969A; --p-cocoa:#3A2A24;
  --f-text:"Noto Sans SC","Noto Sans KR","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-brand:"Fredoka","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#0C1018; --paper:#121826; --surface:#1A2233; --sunk:#202a3d;
  --ink:#E7ECF5; --muted:#9AA4B8; --line:#2B364B;
  --accent:#FF7A57; --accent-soft:#3A2420; --on-accent:#1A0F0B;
  --teal:#4CC0D0; --teal-soft:#16343B; --ok:#5CC48F; --ok-soft:#173327;
  --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --stage:#0C1018; --paper:#121826; --surface:#1A2233; --sunk:#202a3d;
  --ink:#E7ECF5; --muted:#9AA4B8; --line:#2B364B;
  --accent:#FF7A57; --accent-soft:#3A2420; --on-accent:#1A0F0B;
  --teal:#4CC0D0; --teal-soft:#16343B; --ok:#5CC48F; --ok-soft:#173327;
  --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark }

html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-text);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{min-height:100%;display:flex;gap:48px;align-items:center;justify-content:center;padding-block:28px}
.intro{width:300px;flex:none;display:flex;flex-direction:column;gap:18px}
.brand{color:inherit;text-decoration:none;font-family:var(--f-brand);font-weight:600;font-size:34px;letter-spacing:.01em;line-height:1}
.brand small{font-family:var(--f-text);font-size:15px;font-weight:700;color:var(--accent);margin-left:8px;letter-spacing:0}
.intro h1{font-size:20px;line-height:1.4;margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--muted)}
.home-link{font-size:13px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.steps-nav{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.steps-nav button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps-nav button:hover{background:var(--surface)}
.steps-nav button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.steps-nav .n{font-family:var(--f-brand);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--sunk);flex:none}
.steps-nav button[aria-current="true"] .n{background:var(--accent);color:var(--on-accent)}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.lang{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;align-self:flex-start}
.lang button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.phone{width:392px;max-width:100%;height:min(820px,calc(100vh - 56px));min-height:620px;background:var(--paper);border-radius:34px;box-shadow:var(--shadow);
  border:8px solid var(--ink);position:relative;overflow:hidden;flex:none}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.appbar{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.appbar .logo{color:inherit;text-decoration:none;font-family:var(--f-brand);font-weight:600;font-size:20px}
.appbar .logo span{color:var(--accent)}
.appbar .back{border:0;background:none;padding:6px 8px;margin-left:-8px;border-radius:8px;font-size:13px;color:var(--muted)}
.appbar .mini-lang{display:none}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;scroll-behavior:smooth}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:9px 0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

/* generic pieces */
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:14px}
.progress i{height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.04em}
h2{font-size:19px;margin:2px 0 6px;line-height:1.35;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);width:100%}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.demo{background:var(--teal-soft);color:var(--teal);font-weight:700}
.bar-bottom{position:sticky;bottom:-24px;margin:16px -16px -24px;padding:12px 16px;background:var(--paper);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;z-index:3}
.bar-bottom .btn.ghost{white-space:nowrap;flex:none}
.price{font-family:var(--f-brand);font-weight:600;font-size:22px;white-space:nowrap}
.price small{font-family:var(--f-text);font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input.text{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}

/* landing */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 16px 0;overflow:hidden}
.hero h2{font-size:22px}
.hero img{display:block;width:88%;margin:4px auto 0}
.hero .badge{position:absolute;right:14px;top:14px}
.points{display:grid;gap:8px}
.points div{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.points b{font-family:var(--f-brand);color:var(--accent);font-size:15px;min-width:38px;font-variant-numeric:tabular-nums}

/* upload */
.drop{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop .ico{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.photo{position:relative;border-radius:18px;overflow:hidden;background:var(--sunk)}
.photo img{display:block;width:100%}
.photo .meta{position:absolute;left:10px;bottom:10px;background:rgba(15,20,30,.62);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.upbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.upbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .9s ease}

/* generating */
.gen{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.gen .tool{font-size:12px;color:var(--muted)}
.gen ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.gen li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.gen li .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.gen li.doing{color:var(--ink);font-weight:700}
.gen li.doing .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.gen li.done{color:var(--ink)}
.gen li.done .dot{border-color:var(--ok);background:var(--ok);color:#fff}
.gen li.done .dot::after{content:"✓";font-size:11px;font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
.shimmer{aspect-ratio:4/3;border-radius:16px;background:linear-gradient(100deg,var(--sunk) 30%,var(--surface) 50%,var(--sunk) 70%);background-size:300% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-150% 0}}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cand{border:2px solid transparent;border-radius:16px;padding:0;overflow:hidden;background:var(--surface);position:relative}
.cand img{display:block;width:100%;aspect-ratio:4/3.3;object-fit:cover}
.cand[aria-pressed="true"]{border-color:var(--accent)}
.cand[aria-pressed="true"]::after{content:"✓";position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.cand .lab{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(15,20,30,.55);color:#fff;padding:1px 8px;border-radius:999px}

/* 3D viewer */
.viewer{position:relative;height:300px;border-radius:18px;background:radial-gradient(120% 90% at 50% 30%,var(--surface),var(--sunk));border:1px solid var(--line);overflow:hidden;touch-action:none}
.viewer canvas{display:block;width:100%!important;height:100%!important}
.viewer .hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);pointer-events:none}
.viewer .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks div{display:flex;gap:8px;align-items:center;font-size:12.5px;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 10px;font-weight:500}
.pick{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:64px}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pick .pick-empty{font-size:12.5px;color:var(--muted)}
.pick .sw{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-brand);font-weight:600;border:1px solid rgba(0,0,0,.08)}
.pick b{display:block;font-size:14px}
.pick span:not(.sw){display:block;font-size:12.5px}
.pick small{display:block;font-size:11.5px;color:var(--muted)}
.spec{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* plans */
.plan{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.plan[aria-pressed="true"]{border-color:var(--accent)}
.plan .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plan h3{margin:0;font-size:16px}
.plan p{margin:0;color:var(--muted);font-size:12.5px}
.store{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;width:100%;text-align:left}
.store[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.store b{display:block;font-size:14px}
.store span{font-size:12px;color:var(--muted)}
.store .km{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap}

/* order + guide */
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.sumrow:last-child{border-bottom:0}
.sumrow span:first-child{color:var(--muted)}
.success{text-align:center;padding:8px 0 4px}
.success .big{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 8px;font-size:28px;font-weight:700}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;padding-bottom:12px;position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:9px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .d{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1}
.timeline li.done .d{background:var(--ok);border-color:var(--ok)}
.timeline li.now .d{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.timeline li.now b{color:var(--accent)}
.timeline small{color:var(--muted);font-variant-numeric:tabular-nums}
.palette{display:grid;gap:8px}
.paint{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:12px;padding:4px 6px;margin:0 -6px;width:calc(100% + 12px)}
.paint:hover{background:var(--sunk)}
.paint[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.paint .sw{width:38px;height:38px;border-radius:50%;position:relative;border:1px solid rgba(0,0,0,.08);display:grid;place-items:center;font-family:var(--f-brand);font-weight:600;font-size:14px}
.paint b{font-size:13.5px}
.paint span{display:block;font-size:12px;color:var(--muted)}
.paint em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}

/* community */
.banner{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--teal);background:var(--teal-soft);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 10px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters .chip{white-space:nowrap}
.feed{columns:2;column-gap:10px}
.post{break-inside:avoid;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:block;width:100%;padding:0;text-align:left}
.post img{display:block;width:100%}
.post .tc{padding:16px 12px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-weight:700;font-size:15px;line-height:1.4}
.post .tc.event{background:var(--teal-soft);color:var(--teal)}
.post .tc.tip{background:var(--accent-soft);color:var(--accent)}
.post .tc.ask{background:var(--sunk);color:var(--ink)}
.post .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.post .title{font-size:13px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .by{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);gap:6px}
.post .by .u{display:flex;align-items:center;gap:5px;min-width:0}
.post .by .u span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.likes{display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.likes.on{color:var(--accent)}
.swatches{display:flex;gap:6px}
.swatches i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.fab{position:absolute;right:16px;bottom:72px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:11px 16px;box-shadow:0 8px 20px rgba(242,100,63,.35);display:flex;gap:6px;align-items:center;z-index:5}

/* sheet + toast */
.sheet{position:absolute;inset:0;z-index:20;background:rgba(10,14,22,.45);display:flex;align-items:flex-end}
.sheet .panel{background:var(--paper);width:100%;max-height:92%;border-radius:22px 22px 0 0;overflow-y:auto;padding:0 0 16px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet .head{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:12px 16px;z-index:2;border-bottom:1px solid var(--line)}
.sheet .x{border:0;background:var(--sunk);border-radius:50%;width:30px;height:30px}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;background:var(--sunk)}
.gallery figure{margin:0;flex:0 0 100%;scroll-snap-align:start;position:relative}
.gallery img{display:block;width:100%}
.gallery figcaption{position:absolute;left:10px;top:10px;font-size:11px;background:rgba(15,20,30,.55);color:#fff;padding:2px 8px;border-radius:999px}
.pbody{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.pbody h3{margin:0;font-size:16px;line-height:1.4}
.pbody p{margin:0;font-size:13.5px}
.comments{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.cm{display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:13px}
.cm .av{width:28px;height:28px;font-size:11px}
.cm b{font-size:12px;color:var(--muted);font-weight:500;display:block}
.cm .off{color:var(--accent);font-weight:700}
.cbox{display:flex;gap:8px;padding:0 16px}
.cbox input{flex:1;min-width:0}
.cbox .btn{width:auto;padding:10px 14px;font-size:13px}
.toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:8px 14px;border-radius:999px;z-index:30;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}

@media (max-width: 860px){
  .intro{display:none}
  .stage{padding-block:0;align-items:stretch;height:100%;min-height:0}
  .phone{width:100%;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
  body{padding-left:0;padding-right:0}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let renderer, scene, camera, controls, model, host = null, loaded = false, mode = 'color', ro;
const meshes = [];

const PAINT = [0xC9823F, 0xF2E4CC, 0xE8969A, 0x3A2A24];

fetch('assets/parts_b64.txt').then((r) => r.text()).then((b) => {
  const bin = atob(b.trim()); partOf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) partOf[i] = bin.charCodeAt(i);

  for (let f = 0; f < nf; f++) {

let down = null;
function onDown(e) { down = [e.clientX, e.clientY]; }
function onUp(e) {
  if (!down || !mainMesh || !partOf) return;

}
const white = new THREE.MeshStandardMaterial({ color: 0xEDEAE3, roughness: 0.62, metalness: 0 });

function size() {
  if (!host) return;

}

  renderer.domElement.addEventListener('pointerup', onUp);
  fetch('assets/shiba_glb.txt').then((r) => r.text()).then((b64) => {
    const bin = atob(b64.trim()); const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    new GLTFLoader().parse(buf.buffer, '', onModel, (e) => console.error(e));
  });

    model = g.scene;
    const box = new THREE.Box3().setFromObject(model);
    const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());

  }

  onPick: null,
};

</script>

/* ---------- community ---------- */
function allPosts() { return [...S.myPosts, ...POSTS]; }

  return `<div class="tc ${p.card}"><span>${esc(L(p.t))}</span>${extra}</div>`;
}
function vCommunity() {
  const t = T();
  const list = allPosts().filter((p) => S.filter === 0 || p.cat === S.filter);
  return `<div class="banner">ⓘ ${esc(t.cBanner)}</div>
    <div class="filters" role="group">${t.filters.map((f, i) => `<button class="chip" data-act="filter" data-v="${i}" aria-pressed="${S.filter === i}">${esc(f)}</button>`).join('')}</div>

}
function openPost(id) {
  const t = T(), p = allPosts().find((x) => x.id === id); if (!p) return;

  const gal = p.imgs ? `<div class="gallery">${p.imgs.map((im, i) => `<figure><img src="${A}${im}" alt="">${p.imgs.length > 1 ? `<figcaption>${esc(i === 0 ? t.before : t.after)} · ${i + 1}/${p.imgs.length}</figcaption>` : ''}</figure>`).join('')}</div>`
    : `<div style="padding:0 16px">${cover(p)}</div>`;
  $('#sheet').innerHTML = `<div class="panel" role="dialog" aria-modal="true">
    <div class="head"><span class="row" style="gap:8px">${avatar(L(p.u), p.av)}<b style="font-size:14px">${esc(L(p.u))}</b>${p.off ? `<span class="tag" style="color:var(--accent);background:var(--accent-soft)">${esc(t.official)}</span>` : ''}</span><button class="x" data-act="close" aria-label="close">✕</button></div>
    ${gal}
    <div class="pbody"><h3>${esc(L(p.t))}</h3><p>${esc(L(p.b))}</p>
      <div class="row">${(L(p.tags) || []).map((g) => `<span class="tag">${esc(g)}</span>`).join('')}${p.store ? `<span class="tag" style="background:var(--teal-soft);color:var(--teal)">${esc(t.storeTag)} · ${esc(L(p.store))}</span>` : ''}</div>
      <div class="row" style="justify-content:space-between"><span class="tag demo">${esc(t.demo)}</span><button class="chip" data-act="like" data-v="${p.id}" aria-pressed="${!!S.liked[p.id]}">${S.liked[p.id] ? ICON.heart : ICON.heartO} ${likeCount(p)}</button></div>
      <div class="comments">${comments.map((c) => `<div class="cm">${avatar(L(c.u), c.av)}<div><b class="${c.off ? 'off' : ''}">${esc(L(c.u))}${c.off ? ` · ${esc(t.official)}` : ''}</b>${esc(L(c.t))}</div></div>`).join('') || ''}</div></div>
    <form class="cbox" data-post="${p.id}"><input class="text" id="cinput" placeholder="${esc(t.comment)}" autocomplete="off"><button class="btn" type="submit">${esc(t.send)}</button></form></div>`;
  $('#sheet').hidden = false;

/* ---------- render ---------- */
function render() {
  const t = T();
  document.documentElement.lang = S.lang === 'cn' ? 'zh-CN' : 'ko';
  document.title = S.lang === 'cn' ? 'FIGUNI 定制演示 · 피규니' : 'FIGUNI 맞춤 제작 데모 · 피규니';
  $('#i-head').textContent = t.iHead; $('#i-sub').textContent = t.iSub; $('#i-note').textContent = t.iNote;
  $('#demo-tag').textContent = t.demo; $('#i-home').textContent = t.home; $('#logo-home').setAttribute('aria-label', t.homeAria);
  document.querySelectorAll('[data-act="lang"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.lang));
  $('#steps-nav').innerHTML = [t.start, ...t.steps].map((s, i) => `<li><button data-act="jump" data-v="${i}" aria-current="${S.tab === 'create' && Math.min(S.step, 5) === i}"><span class="n">${i}</span>${esc(s)}</button></li>`).join('')
    + `<li><button data-act="tab" data-v="community" aria-current="${S.tab === 'community'}"><span class="n">★</span>${esc(t.tabs[1])}</button></li>`;
  $('#tabs').innerHTML = [['create', ICON.create], ['community', ICON.community], ['orders', ICON.orders]].map(([k, ic], i) =>
    `<button data-act="tab" data-v="${k}" aria-current="${S.tab === k ? 'page' : 'false'}">${ic}${esc(t.tabs[i])}</button>`).join('');
  const back = $('#back');
  back.hidden = !(S.tab === 'create' && S.step > 0 && S.step < 6);
  back.textContent = '‹ ' + t.back;
  let html;
  if (S.tab === 'community') html = vCommunity() + `<button class="fab" data-act="compose">${ICON.plus}${esc(t.publish)}</button>`;
  else if (S.tab === 'orders') html = vOrders();
  else html = [vLanding, vUpload, vCand, vModel, vPlan, vConfirm, vDone][S.step]();
  const scr = $('#screen');
  const name = $('#pet-name')?.value;
  scr.innerHTML = html;
  if (name && $('#pet-name')) $('#pet-name').value = name;
  const v = $('#viewer');
  if (v) {
    S.pick = null; if ($('#pick')) $('#pick').innerHTML = pickCard();
    const mount = () => { window.FIG3D.onPick = showPick; window.FIG3D.mount(v); window.FIG3D.setMode(S.step === 3 && S.tab === 'create' ? S.view : 'color'); };
    if (window.FIG3D) mount(); else window.addEventListener('fig3d-ready', mount, { once: true });
  }
}
function go(step) {
  clearTimers();
  S.tab = 'create'; S.step = step;
  if (step === 2 && S.gen2 < 3) runGen('gen2', 2);
  if (step === 3 && S.gen3 < 3) runGen('gen3', 3);
  render(); $('#screen').scrollTop = 0;
}
function runGen(key, step) {
  S[key] = 0;
  const tick = () => { if (S.step !== step || S.tab !== 'create') return; S[key]++; render(); if (S[key] < 3) later(tick, 900); };
  later(tick, 900);
}
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.id); toast.id = setTimeout(() => { el.hidden = true; }, 1800); }

/* jump straight to any step with sensible defaults (for presenting) */
function jump(i) {
  if (i >= 1) { S.photo = 2; }
  if (i >= 3) { S.gen2 = 3; S.cand = S.cand || 2; }
  if (i >= 4) { S.gen3 = 3; }
  go(i);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'lang') { S.lang = v; S.pick = null; window.FIG3D?.clear(); try { sessionStorage.setItem('figuni-lang', v); } catch (er) {} render(); if (!$('#sheet').hidden) openPost($('#sheet').dataset.post); return; }
  if (act === 'go') return go(+v);
  if (act === 'jump') return jump(+v);
  if (act === 'back') { if (S.step === 3) S.gen3 = 3; if (S.step === 2) S.gen2 = 3; return go(Math.max(0, S.step - 1)); }
  if (act === 'tab') { clearTimers(); S.tab = v; if (v === 'create' && S.step === 0 && S.order) S.step = 6; render(); $('#screen').scrollTop = 0; return; }
  if (act === 'set') { const k = b.dataset.k; S[k] = (k === 'route') ? v : +v; if (k === 'route' && v === 'col') S.size = S.size; render(); return; }
  if (act === 'upload') {
    S.photo = 1; render();
    requestAnimationFrame(() => requestAnimationFrame(() => { const u = $('#upbar'); if (u) u.style.width = '100%'; }));
    later(() => { S.photo = 2; render(); }, 1000); return;
  }
  if (act === 'cand') { S.cand = +v; render(); return; }
  if (act === 'regen') { S.cand = null; S.gen2 = 0; go(2); return; }
  if (act === 'view') { S.view = v; window.FIG3D?.setMode(v); document.querySelectorAll('[data-act="view"]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === v)); return; }
  if (act === 'pay') {
    const d = new Date(); const pad = (n) => String(n).padStart(2, '0');
    S.order = { no: `FG-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-0001`, route: S.route, size: S.size, store: S.store, slot: S.slot, cand: S.cand || 2, name: $('#pet-name')?.value };
    go(6); return;
  }
  if (act === 'share' || act === 'compose') {
    const t = T();
    if (!S.order) { toast(t.noOrder); return; }
    if (!S.myPosts.length) S.myPosts.push({ id: 'me', cat: 1, imgs: ['post_mine.jpg'], av: '#F2643F', likes: 0, mine: 1,
      u: { cn: STR.cn.myName, kr: STR.kr.myName }, store: S.order?.route === 'diy' ? { cn: STR.cn.stores[S.order.store][0], kr: STR.kr.stores[S.order.store][0] } : null,
      t: { cn: STR.cn.pubTitle, kr: STR.kr.pubTitle }, b: { cn: STR.cn.pubBody, kr: STR.kr.pubBody },
      tags: { cn: ['#柴犬', '#FIGUNI'], kr: ['#시바견', '#FIGUNI'] }, c: [] });
    S.tab = 'community'; S.filter = 0; render(); $('#screen').scrollTop = 0; toast(t.posted); return;
  }
  if (act === 'filter') { S.filter = +v; render(); return; }
  if (act === 'paint') {
    const c = +v;
    if (S.pick && S.pick.cls === c && S.pick.part == null) { window.FIG3D?.clear(); showPick(null); }
    else { window.FIG3D?.highlightClass(c); showPick({ cls: c, part: null }); }
    return;
  }
  if (act === 'open') return openPost(v);
  if (act === 'close') { $('#sheet').hidden = true; return; }
  if (act === 'like') { S.liked[v] = !S.liked[v]; openPost(v); render(); return; }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('.cbox'); if (!f) return;
  e.preventDefault();
  const val = $('#cinput').value.trim(); if (!val) return;
  const id = f.dataset.post; (S.extra[id] = S.extra[id] || []).push({ u: { cn: STR.cn.myName, kr: STR.kr.myName }, av: '#F2643F', t: { cn: val, kr: val } });
  openPost(id); const p = $('#sheet .panel'); if (p) p.scrollTop = p.scrollHeight;
});
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') $('#sheet').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#sheet').hidden = true; });

render();
})();
</script>
</body>
